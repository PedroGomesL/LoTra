name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Run Architecture & Resilient Vault Tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python tests/integration/test_system_architecture.py
          else
            python tests/integration/test_system_architecture.py
          fi
        shell: bash

      - name: Run Security, Privacy & Scanner Tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python tests/integration/test_security_privacy_scanner.py
          else
            python tests/integration/test_security_privacy_scanner.py
          fi
        shell: bash

      - name: Run Windows Compiler, OCR & App Integration Tests (Windows only)
        if: runner.os == 'Windows'
        run: python tests/integration/test_windows_compiler_and_app.py

  build-windows:
    name: Build Standalone Windows .exe
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Ensure assets
        run: |
          python scripts/generate_icon.py

      - name: Build executable with PyInstaller
        run: |
          python -m PyInstaller LoTra.spec --noconfirm --clean

      - name: Validate built executable
        run: |
          .\dist\LoTra.exe --version
          .\dist\LoTra.exe --test

      - name: Generate standard SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\LoTra.exe -Algorithm SHA256).Hash.ToLower()
          "$hash *LoTra.exe" | Out-File -Encoding ascii dist\checksum_sha256.txt

      - name: Package release artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\LoTra.exe, dist\checksum_sha256.txt, README.md, LICENSE -DestinationPath dist\LoTra-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoTra-windows-x64
          path: dist/LoTra-windows-x64.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LoTra-windows-x64
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/LoTra-windows-x64.zip
          generate_release_notes: true
